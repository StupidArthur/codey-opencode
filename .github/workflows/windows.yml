name: Windows

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-edition:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Temporal state regression
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          pnpm exec electron scripts/probes/temporal-state-regression.mjs

      - name: Static OpenCode contract probe
        run: pnpm probe:opencode

      # Downloads the pinned patched backend artifact and verifies its fixed
      # SHA-256. The artifact is produced by StupidArthur/opencode-fork and is
      # never built from the fork during CI.
      - name: Prepare pinned OpenCode backend
        run: pnpm prepare:opencode

      - name: OpenCode server smoke
        run: pnpm probe:opencode:smoke

      - name: OpenCode inherited-stdio shell regression
        run: pnpm probe:opencode:shell-hang

      - name: Prepare Electron runtime
        run: pnpm prepare:electron

      - name: Package unpacked Windows app
        run: pnpm exec electron-builder --win --x64 --dir

      - name: Verify packaged OpenCode resource
        shell: pwsh
        run: |
          $path = "release\win-unpacked\resources\opencode\opencode.exe"
          if (-not (Test-Path $path)) { throw "Packaged OpenCode runtime missing: $path" }
          $expected = "03CA853EAAE717FA45A5E8BC180707F865E82F7DF6089816EBAA6988B67D259A"
          $stream = [System.IO.File]::OpenRead($path)
          $sha = [System.Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([System.BitConverter]::ToString($sha.ComputeHash($stream))).Replace("-", "").ToUpperInvariant()
          } finally {
            $sha.Dispose()
            $stream.Dispose()
          }
          if ($actual -ne $expected) { throw "Packaged OpenCode SHA256 mismatch: $actual" }
          $version = (& $path --version 2>&1 | Select-Object -First 1).ToString().Trim()
          if ($version -ne "1.18.31") { throw "Packaged OpenCode version mismatch: $version" }
          Write-Host "PASS packaged OpenCode $version SHA256 $actual"
